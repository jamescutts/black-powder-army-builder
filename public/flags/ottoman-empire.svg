  <polygon
    points="0,-1 0.2245,-0.309 0.951,-0.309 0.363,0.118 0.588,0.951 0,0.382 -0.588,0.951 -0.363,0.118 -0.951,-0.309 -0.2245,-0.309"
    fill="#ffffff"
    transform="translate(1.72,1) scale(0.17)"
  />
</svg>
