<!-- Duchy of Brunswick: black field (for the "Black Brunswickers'" black livery) with the
     traditional white/silver Brunswick-Lüneburg rearing horse (Sachsenross), not gold. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <rect width="3" height="2" fill="#111111"/>
  <!-- Simplified rearing horse in gold/yellow, centred -->
  <g transform="translate(1.5,1.1) scale(0.28)" fill="#f0f0f0">
    <!-- body -->
    <ellipse cx="0" cy="0" rx="1.4" ry="1.0" transform="rotate(-20)"/>
    <!-- neck -->
    <ellipse cx="0.5" cy="-1.4" rx="0.6" ry="1.0" transform="rotate(15,0.5,-1.4)"/>
    <!-- head -->
    <ellipse cx="1.0" cy="-2.4" rx="0.9" ry="0.6" transform="rotate(-10,1,-2.4)"/>
    <!-- front legs (raised) -->
    <rect x="0.5" y="0.8" width="0.4" height="1.4" rx="0.2" transform="rotate(-30,0.7,0.8)"/>
    <rect x="0.8" y="0.8" width="0.4" height="1.4" rx="0.2" transform="rotate(-50,1.0,0.8)"/>
    <!-- rear legs -->
    <rect x="-0.8" y="0.5" width="0.4" height="1.5" rx="0.2"/>
    <rect x="-1.2" y="0.5" width="0.4" height="1.5" rx="0.2"/>
    <!-- tail -->
    <path d="M-1.4,0 Q-3,-0.5 -2.5,-1.8" stroke="#F5C518" stroke-width="0.35" fill="none"/>
  </g>
</svg>
