<!-- Napoleonic Kingdom of Italy, 1805-1814: a red field with a white lozenge touching each edge, and in the
     centre a green rectangle bearing the gold Napoleonic eagle (drawn simplified, to read at icon size). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">
  <rect width="30" height="20" fill="#CE2B37"/>
  <path d="M15,0 L30,10 L15,20 L0,10 Z" fill="#ffffff"/>
  <rect x="7.5" y="5" width="15" height="10" fill="#009246"/>
  <!-- Eagle: wings raised and spread, head turned to the hoist, standing on a thunderbolt -->
  <g transform="translate(15 9.7) scale(0.92)" fill="#F0C030" stroke="#7A5A0E" stroke-width="0.16" stroke-linejoin="round">
    <!-- Wings, each ending in fingered flight feathers -->
    <path d="M-0.9,-0.5 L-1.6,-2.4 L-3.2,-3.9 L-3.3,-3.0 L-4.6,-3.2 L-4.3,-2.3 L-5.3,-2.1 L-4.6,-1.3 L-5.4,-0.9 L-4.4,-0.3 L-4.8,0.4 L-3.2,0.4 L-1.0,1.0 Z"/>
    <path d="M0.9,-0.5 L1.6,-2.4 L3.2,-3.9 L3.3,-3.0 L4.6,-3.2 L4.3,-2.3 L5.3,-2.1 L4.6,-1.3 L5.4,-0.9 L4.4,-0.3 L4.8,0.4 L3.2,0.4 L1.0,1.0 Z"/>
    <!-- Body tapering into a fanned tail -->
    <path d="M-0.4,-1.3 L0.4,-1.3 L1.15,-0.3 L0.75,1.7 L1.35,3.0 L0.4,2.6 L0,3.2 L-0.4,2.6 L-1.35,3.0 L-0.75,1.7 L-1.15,-0.3 Z"/>
    <!-- Head turned to the hoist, with a hooked beak -->
    <circle cx="-0.55" cy="-1.85" r="0.72"/>
    <path d="M-1.15,-2.15 Q-1.9,-2.1 -2.0,-1.6 Q-1.6,-1.75 -1.2,-1.55 Z"/>
    <!-- Thunderbolt -->
    <path d="M-2.6,3.35 L-1.3,3.05 L-0.6,3.5 L0.6,3.1 L1.3,3.55 L2.6,3.25 L2.6,3.75 L1.3,4.05 L0.6,3.6 L-0.6,4.0 L-1.3,3.55 L-2.6,3.85 Z"/>
  </g>
</svg>
