<!-- Confederation of the Rhine: blue field, used by allied German states under Napoleon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <!-- Represent with horizontal triband based on dominant Saxon/Westphalian colours -->
  <rect width="3" height="0.667" y="0"     fill="#000000"/>
  <rect width="3" height="0.666" y="0.667" fill="#F5C518"/>
  <rect width="3" height="0.667" y="1.333" fill="#000000"/>
</svg>
