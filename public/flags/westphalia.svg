<!-- Kingdom of Westphalia (Jerome Bonaparte), 1807-1813: a brand-new Napoleonic client kingdom with
     no dynastic link to the House of Hanover, so the traditional Guelph "white horse" (Sachsenross)
     is the wrong symbol here — that belongs to the displaced Hanoverian rulers of the region, not
     Jerome's regime. Represented instead with a Napoleonic gold eagle, as used by Napoleon's other
     Bonaparte-ruled client kingdoms. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <rect width="3" height="2" fill="#003DA5"/>
  <!-- Simplified Napoleonic eagle, centred -->
  <g transform="translate(1.5,1) scale(0.22)" fill="#F5C518">
    <ellipse cx="0" cy="0" rx="1.2" ry="1.8"/>
    <ellipse cx="-2.8" cy="-0.5" rx="2" ry="0.8" transform="rotate(20,-2.8,-0.5)"/>
    <ellipse cx="2.8" cy="-0.5" rx="2" ry="0.8" transform="rotate(-20,2.8,-0.5)"/>
    <circle cx="0" cy="-2.1" r="0.8"/>
    <polygon points="0.2,-2.5 0.9,-2.2 0.2,-1.9"/>
    <polygon points="-0.5,1.8 0,3.2 0.5,1.8"/>
  </g>
</svg>
