<!-- Kingdom of Westphalia (Jerome Bonaparte), 1807-1813: national flag was a vertical bicolour,
     white (hoist) over blue (fly) — per the Commons "Flag of Kingdom of Westphalia.svg" reference
     and en.wikipedia.org/wiki/Kingdom_of_Westphalia. Not to be confused with the separate Royal
     Standard (blue field with a gold eagle), which is a different flag from the plain national one. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <rect width="1.5" height="2" x="0" fill="#ffffff"/>
  <rect width="1.5" height="2" x="1.5" fill="#112AA0"/>
</svg>
