<!-- Grand Duchy of Hesse (Hesse-Darmstadt): red and white, Hesse's colours from the barry lion in its arms.
     The red-white-red flag (stripes 1+2+1) was probably first flown in 1820 and formally adopted in 1839.
     Drawn as Commons' public-domain "Flagge Großherzogtum Hessen ohne Wappen.svg". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <rect width="3" height="2" fill="#E2001A"/>
  <rect y="0.5" width="3" height="1" fill="#ffffff"/>
</svg>
