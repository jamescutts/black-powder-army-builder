<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">
  <!-- Imperial Guard colour, 1812 pattern, simplified to read at icon size: the tricolour inside an embroidered
       gold border, imperial crowns in the upper corners and a crowned N in a laurel wreath on the white. -->
  <rect width="10" height="20" fill="#1B2F6E"/>
  <rect x="10" width="10" height="20" fill="#ffffff"/>
  <rect x="20" width="10" height="20" fill="#C8102E"/>
  <!-- Embroidered gold border -->
  <rect x="0.6" y="0.6" width="28.8" height="18.8" fill="none" stroke="#E8B923" stroke-width="1.2"/>
  <rect x="1.9" y="1.9" width="26.2" height="16.2" fill="none" stroke="#E8B923" stroke-width="0.35"/>
  <!-- Crowns in the upper corners -->
  <polygon points="2.80,6.74 2.80,4.74 3.68,5.51 4.25,4.12 5.00,5.20 5.75,4.12 6.32,5.51 7.20,4.74 7.20,6.74" fill="#E8B923"/><rect x="2.80" y="6.12" width="4.40" height="0.62" fill="#B8860B"/><circle cx="5.00" cy="3.13" r="0.44" fill="#E8B923"/>
  <polygon points="22.80,6.74 22.80,4.74 23.68,5.51 24.25,4.12 25.00,5.20 25.75,4.12 26.32,5.51 27.20,4.74 27.20,6.74" fill="#E8B923"/><rect x="22.80" y="6.12" width="4.40" height="0.62" fill="#B8860B"/><circle cx="25.00" cy="3.13" r="0.44" fill="#E8B923"/>
  <!-- Laurel wreath and N -->
  <ellipse cx="17.02" cy="14.80" rx="0.42" ry="0.95" transform="rotate(40.0 17.02 14.80)" fill="#E8B923"/>
  <ellipse cx="18.37" cy="13.67" rx="0.42" ry="0.95" transform="rotate(16.4 18.37 13.67)" fill="#E8B923"/>
  <ellipse cx="19.16" cy="12.10" rx="0.42" ry="0.95" transform="rotate(-7.2 19.16 12.10)" fill="#E8B923"/>
  <ellipse cx="19.25" cy="10.34" rx="0.42" ry="0.95" transform="rotate(-30.8 19.25 10.34)" fill="#E8B923"/>
  <ellipse cx="18.63" cy="8.70" rx="0.42" ry="0.95" transform="rotate(-54.4 18.63 8.70)" fill="#E8B923"/>
  <ellipse cx="17.40" cy="7.44" rx="0.42" ry="0.95" transform="rotate(-78.0 17.40 7.44)" fill="#E8B923"/>
  <ellipse cx="12.98" cy="14.80" rx="0.42" ry="0.95" transform="rotate(140.0 12.98 14.80)" fill="#E8B923"/>
  <ellipse cx="11.63" cy="13.67" rx="0.42" ry="0.95" transform="rotate(163.6 11.63 13.67)" fill="#E8B923"/>
  <ellipse cx="10.84" cy="12.10" rx="0.42" ry="0.95" transform="rotate(187.2 10.84 12.10)" fill="#E8B923"/>
  <ellipse cx="10.75" cy="10.34" rx="0.42" ry="0.95" transform="rotate(210.8 10.75 10.34)" fill="#E8B923"/>
  <ellipse cx="11.37" cy="8.70" rx="0.42" ry="0.95" transform="rotate(234.4 11.37 8.70)" fill="#E8B923"/>
  <ellipse cx="12.60" cy="7.44" rx="0.42" ry="0.95" transform="rotate(258.0 12.60 7.44)" fill="#E8B923"/>
  <path d="M16.61,14.99 A4.3,4.3 0 0 0 17.15,7.28" fill="none" stroke="#B8860B" stroke-width="0.3"/>
  <path d="M13.39,14.99 A4.3,4.3 0 0 1 12.85,7.28" fill="none" stroke="#B8860B" stroke-width="0.3"/>
  <path d="M13.3,13.1 V8.9 H14.2 L15.9,11.6 V8.9 H16.7 V13.1 H15.8 L14.1,10.4 V13.1 Z" fill="#E8B923"/>
  <!-- Small crown over the wreath -->
  <polygon points="13.70,5.31 13.70,4.13 14.22,4.58 14.56,3.76 15.00,4.40 15.44,3.76 15.78,4.58 16.30,4.13 16.30,5.31" fill="#E8B923"/><rect x="13.70" y="4.95" width="2.60" height="0.36" fill="#B8860B"/><circle cx="15.00" cy="3.18" r="0.26" fill="#E8B923"/>
</svg>
