<!-- First French Empire flag: tricolor with central golden eagle -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <rect width="1" height="2" x="0" fill="#002395"/>
  <rect width="1" height="2" x="1" fill="#ffffff"/>
  <rect width="1" height="2" x="2" fill="#ED2939"/>
  <!-- Simplified Napoleonic eagle, centred -->
  <g transform="translate(1.5,1) scale(0.22)" fill="#F5C518">
    <!-- body -->
    <ellipse cx="0" cy="0" rx="1.2" ry="1.8"/>
    <!-- left wing -->
    <ellipse cx="-2.8" cy="-0.5" rx="2" ry="0.8" transform="rotate(20,-2.8,-0.5)"/>
    <!-- right wing -->
    <ellipse cx="2.8" cy="-0.5" rx="2" ry="0.8" transform="rotate(-20,2.8,-0.5)"/>
    <!-- head -->
    <circle cx="0" cy="-2.1" r="0.8"/>
    <!-- beak -->
    <polygon points="0.2,-2.5 0.9,-2.2 0.2,-1.9"/>
    <!-- tail feathers -->
    <polygon points="-0.5,1.8 0,3.2 0.5,1.8"/>
  </g>
</svg>
