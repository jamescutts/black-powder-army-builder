<!-- Grand Duchy of Baden: red over yellow, Baden's colours from the red bend on gold in its arms. Baden had no
     formal state flag in 1812; this bicolour is first recorded in 1871 and drawn as Commons' public-domain
     "Flag of the Grand Duchy of Baden (1855–1891).svg". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <rect width="3" height="2" fill="#FCC300"/>
  <rect width="3" height="1" fill="#E2001A"/>
</svg>
