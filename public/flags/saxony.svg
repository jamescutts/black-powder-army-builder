<!-- Kingdom of Saxony: white over green horizontal bicolour, the flag from 16 June 1815. Strictly, Saxony
     in 1812 flew the older black and yellow bicolour (Commons: "State flag of Saxony before 1815"), but that
     is all but indistinguishable from Austria's black and yellow at the sizes the site shows flags, so the
     better-known white and green is kept on purpose. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2">
  <rect width="3" height="1" y="0" fill="#ffffff"/>
  <rect width="3" height="1" y="1" fill="#009900"/>
</svg>
