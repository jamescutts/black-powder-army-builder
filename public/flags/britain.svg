<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <!-- The Union Flag as flown from 1801, the standard 1:2 construction. -->
  <clipPath id="flag"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
  <!-- St Patrick's red is counterchanged: in each arm it runs along the half nearer the top in the hoist-side
       quarters and nearer the bottom in the fly-side ones. These triangles keep only those halves. -->
  <clipPath id="patrick"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
  <g clip-path="url(#flag)">
    <!-- Blue field -->
    <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
    <!-- St Andrew: white saltire -->
    <path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6"/>
    <!-- St Patrick: red saltire, counterchanged -->
    <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#patrick)" stroke="#C8102E" stroke-width="4"/>
    <!-- St George: red cross with its white border -->
    <path d="M30,0 v30 M0,15 h60" stroke="#ffffff" stroke-width="10"/>
    <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
  </g>
</svg>
