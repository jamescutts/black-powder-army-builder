<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Army Builder mark: a flaming grenade (the grenadier's badge) in a ring, cream on the header's dark brown.
       Next.js serves this as the browser-tab icon. -->
  <circle cx="16" cy="16" r="16" fill="#33200f"/>
  <circle cx="16" cy="16" r="13.4" fill="none" stroke="#f2ecd6" stroke-width="1.1"/>
  <g fill="#f2ecd6" stroke="#f2ecd6" stroke-linejoin="round">
    <!-- Shell -->
    <circle cx="16" cy="19.4" r="5.8" stroke="none"/>
    <!-- Fuse collar -->
    <rect x="14.3" y="12.1" width="3.4" height="1.8" rx="0.3" stroke="none"/>
    <!-- Flame: three tongues -->
    <path d="M16 11.4c-1.5-1.7-0.7-3.6 0-5.1 0.7 1.5 1.5 3.4 0 5.1z" stroke-width="0.6"/>
    <path d="M14.9 11.7c-1.9-0.6-2.8-2.3-2.8-3.8 1.1 0.8 2.4 1.7 2.8 3.8z" stroke-width="0.6"/>
    <path d="M17.1 11.7c1.9-0.6 2.8-2.3 2.8-3.8-1.1 0.8-2.4 1.7-2.8 3.8z" stroke-width="0.6"/>
  </g>
</svg>
